<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>扫码登录 · BiliLiveCoyote</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { width: min(760px, 94vw); }
        .login-flex { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
        .qr-wrap {
            background: #fff; padding: 12px; border-radius: 12px;
            width: 216px; height: 216px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
        }
        .qr-wrap svg { width: 192px; height: 192px; }
        .mask {
            position: absolute; inset: 0; border-radius: 12px;
            background: rgba(16, 16, 32, .88); color: #fff; font-size: 13px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        }
        .qr-holder { position: relative; }
        .state-title { font-size: 17px; font-weight: 700; color: #00d9ff; margin-bottom: 8px; }
        .state-desc { font-size: 13px; color: #aeb3c4; line-height: 1.8; }
        .steps { margin: 12px 0 0; padding-left: 20px; font-size: 13px; color: #aeb3c4; line-height: 1.9; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .badge.ok { background: rgba(0, 217, 255, .15); color: #00d9ff; }
        .badge.warn { background: rgba(255, 107, 107, .15); color: #ff6b6b; }
        .badge.dim { background: rgba(255, 255, 255, .08); color: #9aa1b1; }
    </style>
</head>
<body>
    <div class="container login-box">
        <div class="card">
            <h2>📱 扫码登录 Bilibili</h2>
            <div style="margin-bottom:16px; font-size:13px;">
                当前登录状态：<span class="badge dim" id="now-state">检查中…</span>
            </div>

            <div class="login-flex">
                <div class="qr-holder">
                    <div class="qr-wrap" id="qr-wrap"></div>
                    <div class="mask" id="qr-mask">正在生成二维码…</div>
                </div>

                <div style="flex:1; min-width:260px;">
                    <div class="state-title" id="state-title">等待扫码</div>
                    <div class="state-desc" id="state-desc">二维码 3 分钟内有效</div>
                    <ol class="steps">
                        <li>打开手机 <b>哔哩哔哩 App</b></li>
                        <li>点击右上角「＋」→ <b>扫一扫</b></li>
                        <li>扫描左侧二维码并确认登录</li>
                    </ol>
                    <div style="display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;">
                        <button class="btn-primary" onclick="startLogin()" id="btn-refresh">刷新二维码</button>
                        <button class="btn-secondary" onclick="location.href='/'" id="btn-skip">跳过，先进入控制台</button>
                    </div>
                    <div style="margin-top:14px; font-size:12px; color:#888;" id="tip">
                        扫码成功后会自动刷新登录凭证并写入 config.yaml，然后跳转到控制台
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/login.js"></script>
</body>
</html>
